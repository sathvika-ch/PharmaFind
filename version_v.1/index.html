<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaFind — Medicine Availability & Pharmacy Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<div id="modal-root"></div>

<!-- ============================================================
     START-UP CHECK
     If the app can't start, this shows WHAT is wrong on the page
     instead of leaving it blank. It never runs when the app works:
     the app fills #root within moments and this does nothing.
     ============================================================ -->
<script>
(function(){
  var SDK = "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  var NEEDED   = ["app.js", "firebase-config.js", "styles.css"];
  var OPTIONAL = ["map.js", "prescription.js"];
  var caught = [];

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // Remember any error that happens while the app is loading.
  window.addEventListener("error", function(e){
    var t = e.target;
    if(t && t.tagName === "SCRIPT"){ caught.push("A script failed to load: " + (t.getAttribute("src") || "inline")); }
    else if(e.message){ caught.push(e.message + (e.filename ? "  [" + e.filename.split("/").pop().split("?")[0] + ", line " + e.lineno + "]" : "")); }
  }, true);
  window.addEventListener("unhandledrejection", function(e){
    var r = e.reason; caught.push(String(r && r.message ? r.message : r));
  });

  function check(url){
    return fetch(url, { cache: "no-store" })
      .then(function(r){ return r.ok ? "ok" : ("missing (HTTP " + r.status + ")"); })
      .catch(function(){ return "unreachable"; });
  }

  function report(){
    var root = document.getElementById("root");
    if(!root || root.innerHTML.trim()) return;                 // the app started — nothing to do

    if(location.protocol === "file:"){
      show(root, ["You opened this file directly (file://). Open it through a local server instead — e.g. VS Code “Live Server”/“Live Preview”, or run  python -m http.server  in this folder."], []);
      return;
    }

    var files = NEEDED.concat(OPTIONAL);
    Promise.all(files.map(check).concat([check(SDK)])).then(function(res){
      var rows = files.map(function(f, i){
        return { name: f + (OPTIONAL.indexOf(f) >= 0 ? " (optional add-on)" : ""), state: res[i], optional: OPTIONAL.indexOf(f) >= 0 };
      });
      rows.push({ name: "Firebase library (needs internet)", state: res[res.length - 1], optional: false });

      var tips = [];
      rows.forEach(function(r){
        if(r.state !== "ok" && !r.optional){
          tips.push(r.name.indexOf("Firebase") === 0
            ? "The Firebase library can't be downloaded. Check your internet connection, or turn off an ad-blocker / firewall that blocks gstatic.com."
            : "“" + r.name + "” is not in this folder. Copy ALL the files from the zip into the same folder as index.html.");
        }
      });
      if(!tips.length && !caught.length) tips.push("All files are present. Press Ctrl+Shift+R to hard-refresh. If it's still blank, press F12 → Console and send the red error text.");
      if(!tips.length && caught.length) tips.push("The files are present but one of them is an older or mixed version. Replace the whole folder with the contents of the latest zip (don't mix old and new files).");
      show(root, tips, rows);
    });
  }

  function show(root, tips, rows){
    if(root.innerHTML.trim()) return;
    var h = '<div style="max-width:640px;margin:8vh auto;padding:24px;font-family:system-ui,Segoe UI,Arial,sans-serif;'
          + 'background:#fff;color:#17211d;border:1px solid #e0b4b4;border-radius:14px;line-height:1.55">'
          + '<h2 style="margin:0 0 6px;font-size:20px">⚠️ PharmaFind couldn’t start</h2>'
          + '<p style="margin:0 0 14px;color:#5f6d66">This page checks itself. Here is what it found:</p>';
    if(rows.length){
      h += '<table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:14px">';
      rows.forEach(function(r){
        var ok = r.state === "ok";
        h += '<tr><td style="padding:5px 0;border-bottom:1px solid #eee">' + esc(r.name) + '</td>'
           + '<td style="padding:5px 0;border-bottom:1px solid #eee;text-align:right;font-weight:600;color:' + (ok ? "#16a34a" : (r.optional ? "#8a978f" : "#dc2626")) + '">'
           + (ok ? "✓ found" : esc(r.state)) + '</td></tr>';
      });
      h += '</table>';
    }
    h += '<b>What to do</b><ul style="margin:6px 0 14px;padding-left:20px">';
    tips.forEach(function(t){ h += '<li>' + esc(t) + '</li>'; });
    h += '</ul>';
    if(caught.length){
      h += '<b>Error reported by the browser</b>'
         + '<pre style="white-space:pre-wrap;background:#f6f1f1;border-radius:8px;padding:10px;font-size:12.5px;margin:6px 0 0">' + esc(caught.slice(0, 4).join("\n")) + '</pre>';
    }
    h += '<p style="margin:14px 0 0;font-size:12.5px;color:#8a978f">Address: ' + esc(location.href) + '</p></div>';
    root.innerHTML = h;
  }

  window.addEventListener("load", function(){ setTimeout(report, 4000); });
})();
</script>

<!-- app.js is an ES module (it imports the Firebase SDK + your config).
     Modules must be served over http(s), so open the app through a local
     server, e.g.  npx serve  or  python -m http.server  — opening the file
     directly with file:// will NOT work. -->
<script type="module" src="app.js"></script>
</body>
</html>
